services:
  next-app:
    build: .
    container_name: cook_next_app
    ports:
      - "3000:3000"
    volumes:
      - ./lethimcook-app:/app
      - /app/node_modules
    environment:
      - WATCHPACK_POLLING=true
    restart: unless-stopped

  ollama:
    image: ollama/ollama
    container_name: cook_ollama_next
    ports:
      - "8080:11434"
    restart: unless-stopped
    entrypoint: ["/app/ollama/entrypoint.sh"]
    volumes:
      - ./ollama/entrypoint.sh:/app/ollama/entrypoint.sh
